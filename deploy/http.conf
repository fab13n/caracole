# Configuration nginx HTTP (dev / test).
# Utilisée quand PUBLIC_PROTO=http dans le .env.

upstream django { server django_prod:8000; }

server {
    listen 80;
    # En production, décommenter et adapter :
    # server_name votre-domaine.example.com;

    gzip on;
    gzip_comp_level 6;

    location / {
        # Décommenter la ligne suivante pour mettre le site en maintenance :
        # return 503;

        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /var/www/solalim/static/;
    }

    location /media/ {
        alias /var/www/solalim/media/;
    }
}
